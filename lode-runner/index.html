<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d1a">
<title>Lode Rush</title>
<style>
/* Layout: full-screen arcade cabinet. HUD strip on top, playfield fitted to the space, touch controls in the bottom corners. Single dark look. */
:root {
  --bg: #0b0d1a;
  --panel: #151a33;
  --ink: #f3ecd2;
  --dim: #8a8fb3;
  --gold: #ffc93c;
  --brick: #c4532d;
  --danger: #ff5a6e;
  --ctl: rgba(243, 236, 210, 0.10);
  --ctl-edge: rgba(243, 236, 210, 0.28);
  --ctl-on: rgba(255, 201, 60, 0.42);
  --font-pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --font-body: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: var(--font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: none; overscroll-behavior: none;
}
#app {
  position: fixed; inset: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  display: flex; flex-direction: column;
}
#hud {
  display: flex; align-items: center; gap: 14px; padding: 6px 12px; height: 34px; flex: none;
  font-family: var(--font-pixel); font-size: 10px; letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
#hud .lbl { color: var(--dim); margin-right: 4px; }
#hud .gold { color: var(--gold); }
#hud .sp { flex: 1; }
#hud button {
  font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--ctl-edge);
  border-radius: 6px; padding: 5px 9px; touch-action: manipulation;
}
#stage { position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; }
@media (orientation: landscape) { #stage { align-items: center; } }
canvas#c {
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: #050611; border: 2px solid #232a52; border-radius: 4px;
}
/* Touch controls */
.ctl { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 5; touch-action: none; }
#pad { left: calc(env(safe-area-inset-left, 0px) + 14px); width: var(--pad, 156px); height: var(--pad, 156px); border-radius: 50%;
  background: var(--ctl); border: 2px solid var(--ctl-edge); }
#pad .arr { position: absolute; width: 34%; height: 34%; display: grid; place-items: center; color: var(--ink); opacity: 0.55;
  font-size: 22px; border-radius: 10px; }
#pad .arr.on { background: var(--ctl-on); opacity: 1; }
#pad .u { left: 33%; top: 2%; } #pad .d { left: 33%; bottom: 2%; }
#pad .l { left: 2%; top: 33%; } #pad .r { right: 2%; top: 33%; }
#knob { position: absolute; width: 30%; height: 30%; left: 35%; top: 35%; border-radius: 50%;
  background: rgba(243,236,210,0.25); border: 2px solid var(--ctl-edge); pointer-events: none; transition: transform 40ms linear; }
#digs { right: calc(env(safe-area-inset-right, 0px) + 14px); display: flex; gap: 14px; align-items: flex-end; }
.dig { width: var(--dig, 78px); height: var(--dig, 78px); border-radius: 50%; border: 2px solid var(--ctl-edge);
  background: var(--ctl); color: var(--ink); font-family: var(--font-pixel); font-size: 9px;
  display: grid; place-items: center; line-height: 1.5; touch-action: none; padding: 0; }
.dig b { display: block; font-size: 22px; font-family: var(--font-body); color: var(--brick); }
.dig.on { background: var(--ctl-on); }
#digR { margin-bottom: 34px; }
/* Overlays */
[hidden] { display: none !important; }
#ov { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(5, 6, 17, 0.82);
  padding: 16px; overflow-y: auto; touch-action: pan-y; }
.card { width: min(440px, 100%); background: var(--panel); border: 2px solid #2b3366; border-radius: 12px; padding: 20px 18px;
  display: flex; flex-direction: column; gap: 12px; text-align: center; }
.card h1 { font-family: var(--font-pixel); font-size: 26px; margin: 4px 0 2px; color: var(--gold); letter-spacing: 0.06em;
  text-shadow: 3px 3px 0 var(--brick); }
.card h2 { font-family: var(--font-pixel); font-size: 15px; margin: 2px 0; line-height: 1.5; text-wrap: balance; }
.card p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.5; }
.card .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn { font-family: var(--font-pixel); font-size: 11px; color: var(--bg); background: var(--gold); border: none; border-radius: 8px;
  padding: 14px 16px; touch-action: manipulation; cursor: pointer; flex: 1 1 auto; }
.btn.alt { background: transparent; color: var(--ink); border: 2px solid var(--ctl-edge); }
.btn:focus-visible, #hud button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.levels button { font-family: var(--font-pixel); font-size: 12px; aspect-ratio: 1; border-radius: 8px; border: 2px solid var(--ctl-edge);
  background: #1d2346; color: var(--ink); touch-action: manipulation; padding: 0; }
.levels button.done { border-color: var(--gold); color: var(--gold); }
.levels button:disabled { opacity: 0.3; }
.help { text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; color: var(--ink); }
.help dt { font-family: var(--font-pixel); font-size: 10px; color: var(--gold); padding-top: 3px; }
.help dd { margin: 0; color: var(--dim); line-height: 1.4; }
.stat { font-family: var(--font-pixel); font-size: 11px; color: var(--ink); line-height: 1.8; }
#rot { display: none; }
@media (orientation: portrait) { #rot { display: block; } }
@media (prefers-reduced-motion: reduce) { #knob { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span><span class="lbl">LV</span><span id="hLvl">1</span></span>
    <span class="gold"><span class="lbl">$</span><span id="hGold">0</span></span>
    <span><span class="lbl">♥</span><span id="hLives">5</span></span>
    <span><span class="lbl">PTS</span><span id="hScore">0</span></span>
    <span class="sp"></span>
    <button id="bPause" type="button" aria-label="Pause">II</button>
  </div>
  <div id="stage"><canvas id="c" width="448" height="256"></canvas></div>
  <div id="pad" class="ctl" aria-label="Move">
    <div class="arr u">▲</div><div class="arr d">▼</div><div class="arr l">◀</div><div class="arr r">▶</div>
    <div id="knob"></div>
  </div>
  <div id="digs" class="ctl">
    <button class="dig" id="digL" type="button" aria-label="Dig left"><span><b>◣</b>DIG</span></button>
    <button class="dig" id="digR" type="button" aria-label="Dig right"><span><b>◢</b>DIG</span></button>
  </div>
  <div id="ov"></div>
</div>
<script>

// ---------------------------------------------------------------------------
const W = 28, H = 16, T = 16;
const E = 0, BR = 1, SO = 2, LA = 3, RO = 4, TR = 5, HI = 6, HOLE = 7;
const DIG_T = 16, OPEN_T = 330, FILL_T = 40;        // hole timings (ticks @60Hz)
const TRAP_T = 150;                                  // guard stuck in hole
const PLAYER_SPD = 1.1, PLAYER_FALL = 1.7;
const DIFF = {
  easy:   { label: 'Easy',   guard: 0.48, lives: 9 },
  normal: { label: 'Normal', guard: 0.60, lives: 6 },
  hard:   { label: 'Hard',   guard: 0.74, lives: 4 },
};

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---------------------------------------------------------------------------
// Persistence
const SAVE_KEY = 'lodeRush.v1';
let save = { unlocked: 1, done: {}, diff: 'normal', sound: true, best: 0, cur: null };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ---------------------------------------------------------------------------
// Sound (tiny synth, starts after first touch)
let actx = null;
function audio() {
  if (!save.sound) return null;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f0, f1, dur, type = 'square', vol = 0.05, delay = 0) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  gold() { tone(880, 880, 0.06, 'square', 0.04); tone(1320, 1320, 0.09, 'square', 0.04, 0.06); },
  dig() { tone(220, 70, 0.18, 'sawtooth', 0.05); },
  trap() { tone(330, 160, 0.2, 'triangle', 0.08); },
  kill() { tone(700, 90, 0.3, 'square', 0.05); },
  die() { tone(660, 50, 0.9, 'sawtooth', 0.06); },
  reveal() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.12, 'square', 0.04, i * 0.08)); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f, 0.14, 'triangle', 0.08, i * 0.1)); },
};
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

"......pppp......",".....pp..pp.....","....pp....pp....","...pp......pp...","...f........f...","................"],
};
const PAL = {
  player: { h: '#f3ecd2', s: '#f6c79a', k: '#10131f', b: '#3aa6ff', p: '#f3ecd2', f: '#8a8fb3' },
  guard:  { h: '#ff5a6e', s: '#ffd0a0', k: '#ffffff', b: '#c03a52', p: '#5b2a43', f: '#1b0d16' },

function makeSprite(rows, pal, flip) {
  const c = document.createElement('canvas'); c.width = 16; c.height = 16;
  const x = c.getContext('2d');
  rows.forEach((row, y) => { for (let i = 0; i < 16; i++) { const ch = row[i]; if (ch !== '.' && pal[ch]) {

  return c;
}
const sprites = {};
for (const who in PAL) { sprites[who] = {}; for (const k in SPR) {
  sprites[who][k] = [makeSprite(SPR[k], PAL[who], false), makeSprite(SPR[k], PAL[who], true)]; } }

// Tiles
function tileCanvas(draw) { const c = document.createElement('canvas'); c.width = T; c.height = T; draw(c.getContext('2d')); return c; }

// ---------------------------------------------------------------------------
// Game state
let G = null;            // current level state
let mode = 'menu';       // menu | play | pause | dying | won | over | done
let lives = 6, score = 0, levelIdx = 0;

function loadLevel(i) {
  const L = LEVELS[i];
  const map = [], gold = [];
  let player = null; const guards = [];
  for (let r = 0; r < H; r++) {

  showOverlay(`<div class="card"><h2>How to play</h2>
    <dl class="help">
      <dt>MOVE</dt><dd>Drag the left pad. Hold diagonal to grab a ladder as you run past it.</dd>
      <dt>DIG</dt><dd>◣ / ◢ blast the brick below-left or below-right. Guards fall in and get stuck for a few seconds.</dd>
      <dt>HOLES</dt><dd>Bricks grow back after about 6 seconds. Anyone still inside is crushed. Guards respawn at the top.</dd>
      <dt>GOLD</dt><dd>Guards with a yellow hat are carrying gold. Trap them to make them drop it.</dd>
      <dt>EXIT</dt><dd>Take all the gold, then climb the new ladder to the top row.</dd>
      <dt>TRICKS</dt><dd>You can walk across a trapped guard's head. Some bricks are fake. You can't dig under ladders or gold.</dd>
      <dt>KEYS</dt><dd>Arrows / WASD, Z and X to dig, P to pause.</dd>
    </dl>
    <div class="row"><button class="btn alt" id="hBack">Back</button></div></div>`);
  $('hBack').onclick = mode === 'pause' ? showPause : showMenu;
}
function showPause() {
  if (mode !== 'play' && mode !== 'pause') return;
  mode = 'pause';
  showOverlay(`<div class="card"><h2>Paused</h2>
    <p>Level ${levelIdx + 1}: ${LEVELS[levelIdx].name}</p>
    <div class="row"><button class="btn" id="pRes">Resume</button></div>
    <div class="row"><button class="btn alt" id="pRestart">Stuck? Restart (−1 ♥)</button></div>
    <div class="row">
      <button class="btn alt" id="pHelp">How to play</button>
      <button class="btn alt" id="pSnd">Sound: ${save.sound ? 'On' : 'Off'}</button>
    </div>
    <div class="row"><button class="btn alt" id="pMenu">Main menu</button></div></div>`);
  $('pRes').onclick = resume;
  $('pRestart').onclick = () => { hideOverlay(); mode = 'play'; killPlayer(); };
  $('pHelp').onclick = showHelp;
  $('pSnd').onclick = () => { save.sound = !save.sound; persist(); showPause(); };
  $('pMenu').onclick = () => { save.cur = { level: levelIdx, score, lives }; persist(); showMenu(); };
}
function resume() { hideOverlay(); mode = 'play'; lastT = performance.now(); }
function showWon() {
  showOverlay(`<div class="card"><h2>Level ${levelIdx + 1} clear!</h2>
    <p class="stat">+1500 · +1 ♥<br>SCORE ${score}</p>
    <div class="row"><button class="btn" id="wNext">Level ${levelIdx + 2}: ${LEVELS[levelIdx + 1].name}</button></div>
    <div class="row"><button class="btn alt" id="wMenu">Menu</button></div></div>`);
  $('wNext').onclick = () => startLevel(levelIdx + 1);
  $('wMenu').onclick = showMenu;
}
function showOver() {
  mode = 'over';
  showOverlay(`<div class="card"><h2>Game over</h2>
    <p class="stat">SCORE ${score}</p>
    <div class="row"><button class="btn" id="oRetry">Retry level ${levelIdx + 1}</button></div>
    <div class="row"><button class="btn alt" id="oMenu">Menu</button></div></div>`);
  $('oRetry').onclick = () => newGame(levelIdx);
  $('oMenu').onclick = showMenu;
}
function showDone() {
  mode = 'done';
  showOverlay(`<div class="card"><h1>RICH!</h1><h2>You cleared all ${LEVELS.length} levels</h2>
    <p class="stat">SCORE ${score}</p>
    <p>Try them again with tougher guards: switch Guards to Hard in the menu.</p>
    <div class="row"><button class="btn" id="dMenu">Menu</button></div></div>`);
  $('dMenu').onclick = showMenu;
}
function startLevel(i) {
  levelIdx = i; loadLevel(i); hideOverlay(); mode = 'play';
  save.cur = { level: i, score, lives }; persist();
  lastT = performance.now(); wake();
}

// ---------------------------------------------------------------------------
// Touch controls
const pad = { h: 0, v: 0, id: null };
const padEl = $('pad'), knob = $('knob');
const arrows = { u: padEl.querySelector('.u'), d: padEl.querySelector('.d'), l: padEl.querySelector('.l'), r: padEl.querySelector('.r') };
function padFrom(e) {
  const rc = padEl.getBoundingClientRect();
  const cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2, rad = rc.width / 2;
  let dx = (e.clientX - cx) / rad, dy = (e.clientY - cy) / rad;
  const len = Math.hypot(dx, dy);
  let h = 0, v = 0;
  if (len > 0.22) {
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ay < ax * 0.5) h = Math.sign(dx);
    else if (ax < ay * 0.5) v = Math.sign(dy);
    else { h = Math.sign(dx); v = Math.sign(dy); }
  }
  pad.h = h; pad.v = v;
  const k = Math.min(len, 1) / (len || 1);
  knob.style.transform = `translate(${dx * k * rad * 0.62}px, ${dy * k * rad * 0.62}px)`;
  paintPad();
}
function paintPad() {
  arrows.u.classList.toggle('on', pad.v < 0); arrows.d.classList.toggle('on', pad.v > 0);
  arrows.l.classList.toggle('on', pad.h < 0); arrows.r.classList.toggle('on', pad.h > 0);
}
function padEnd(e) {
  if (e.pointerId !== pad.id) return;
  pad.id = null; pad.h = 0; pad.v = 0; knob.style.transform = ''; paintPad();
}
padEl.addEventListener('pointerdown', e => { e.preventDefault(); audio(); pad.id = e.pointerId; padEl.setPointerCapture(e.pointerId); padFrom(e); });
padEl.addEventListener('pointermove', e => { if (e.pointerId === pad.id) padFrom(e); });
padEl.addEventListener('pointerup', padEnd);
padEl.addEventListener('pointercancel', padEnd);
padEl.addEventListener('lostpointercapture', padEnd);
for (const [id, d] of [['digL', -1], ['digR', 1]]) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); b.classList.add('on'); queueDig(d); });
  const off = () => b.classList.remove('on');
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
}
$('bPause').addEventListener('click', () => { if (mode === 'play') showPause(); else if (mode === 'pause') resume(); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

const KEYMAP = { ArrowLeft: 1, ArrowRight: 1, ArrowUp: 1, ArrowDown: 1, a: 1, d: 1, w: 1, s: 1 };
window.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (KEYMAP[k]) { keys.add(k); e.preventDefault(); }
  if (k === 'z' || k === 'q') queueDig(-1);
  if (k === 'x' || k === 'e') queueDig(1);
  if (k === 'p' || k === 'Escape') { if (mode === 'play') showPause(); else if (mode === 'pause') resume(); }
  if ((k === ' ' || k === 'Enter') && mode === 'won') { e.preventDefault(); if (levelIdx + 1 < LEVELS.length) startLevel(levelIdx + 1); }
});
window.addEventListener('keyup', e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
window.addEventListener('blur', () => keys.clear());
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') showPause(); if (!document.hidden) wake(); });

// Keep the screen on while playing
let wakeLock = null;
async function wake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}

// ---------------------------------------------------------------------------
// Layout: fit the playfield; size controls to the screen
function layout() {
  const st = $('stage').getBoundingClientRect();
  const portrait = window.innerHeight > window.innerWidth;
  const padSize = Math.round(Math.min(180, Math.max(120, Math.min(window.innerWidth, window.innerHeight) * (portrait ? 0.42 : 0.4))));
  document.documentElement.style.setProperty('--pad', padSize + 'px');
  document.documentElement.style.setProperty('--dig', Math.round(padSize * 0.5) + 'px');
  let availW = st.width - 8, availH = st.height - 8;
  if (portrait) availH = Math.min(availH, st.height - padSize - 40);
  const s = Math.max(0.5, Math.min(availW / 448, availH / 256));
  cv.style.width = Math.floor(448 * s) + 'px';
  cv.style.height = Math.floor(256 * s) + 'px';
  cv.style.marginTop = portrait ? '6px' : '0';
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 150));

// ---------------------------------------------------------------------------
// Main loop (fixed 60Hz step)
let lastT = performance.now(), accT = 0;
function frame(now) {
  let dt = now - lastT; lastT = now;
  if (dt > 250) dt = 250;
  if (G && (mode === 'play' || mode === 'dying' || mode === 'won')) {
    accT += dt;
    while (accT >= 1000 / 60) { accT -= 1000 / 60; tick(); }
  } else accT = 0;
  draw(); hud();
  requestAnimationFrame(frame);
}
layout();
loadLevel(save.cur ? save.cur.level : 0);
levelIdx = save.cur ? save.cur.level : 0;
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
